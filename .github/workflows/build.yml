name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas openpyxl pyinstaller

      - name: Build Windows executable
        run: python build.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Excel进销存工具-Windows
          path: dist/Excel进销存工具.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas openpyxl pyinstaller

      - name: Build Mac app
        run: python build.py

      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: Excel进销存工具-Mac
          path: dist/Excel进销存工具.app

  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Excel进销存工具-Windows

      - name: Download Mac artifact
        uses: actions/download-artifact@v4
        with:
          name: Excel进销存工具-Mac

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Excel进销存工具.exe
            Excel进销存工具.app